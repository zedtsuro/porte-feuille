<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <!-- Pièce qui dépasse du portefeuille -->
  <circle cx="38" cy="19" r="9.5" fill="url(#coin)"/>
  <circle cx="38" cy="19" r="6" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="1.6"/>
  <!-- Rabat arrière -->
  <rect x="14" y="20" width="30" height="9" rx="3" fill="#fff" fill-opacity=".45"/>
  <!-- Corps du portefeuille -->
  <rect x="11" y="24" width="40" height="27" rx="6.5" fill="#fff"/>
  <!-- Fermoir -->
  <rect x="37" y="32" width="17" height="11" rx="5.5" fill="#c7d2fe"/>
  <circle cx="43.5" cy="37.5" r="2.4" fill="#6366f1"/>
  <!-- Courbe de tendance -->
  <path d="M17 44l6-6 4 3 6-7" fill="none" stroke="#10b981" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
